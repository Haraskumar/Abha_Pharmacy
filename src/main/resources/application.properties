# -----------------------------------------------------------------------------
# Abha Pharmacy - Production-Grade Configuration
# Decoupled 12-Factor App Environment Injections (Safe Localhost Fallback)
# -----------------------------------------------------------------------------

# Primary Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/abha_pharmacy?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Abha_Pharmacy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pharmacy@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Initialization Mode
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Port (PaaS Render/Railway/Heroku auto-injects PORT)
server.port=${PORT:8081}

# Healthcare Clinical AI & Payment Gateway Secrets (Injected via Cloud Env Vars)
gemini.api.key=${GEMINI_API_KEY:}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
