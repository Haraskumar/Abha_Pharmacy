<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Abha Pharmacy - Customer Login</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon-32.png}" href="/images/favicon-32.png"/>
    <link rel="apple-touch-icon" th:href="@{/images/favicon.png}" href="/images/favicon.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:"#005f49","primary-container":"#0d7a5f","on-primary":"#ffffff",surface:"#faf8ff","surface-container-lowest":"#ffffff","surface-container-low":"#f2f3ff","surface-container":"#eaedff","surface-container-high":"#e2e7ff","on-surface":"#131b2e","on-surface-variant":"#3e4944",outline:"#6e7a74","outline-variant":"#bdc9c2",error:"#ba1a1a","error-container":"#ffdad6","secondary-container":"#a6eed2","on-secondary-container":"#266e58"}}}}</script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4 font-[Inter]">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <a href="/" class="inline-block hover:scale-105 transition-transform">
                <img th:src="@{/images/logo_mark.png}" src="/images/logo_mark.png" alt="Abha Pharmacy" class="w-16 h-16 mx-auto mb-2 object-contain" />
            </a>
            <h1 class="text-2xl font-bold text-primary font-[Plus_Jakarta_Sans]">Abha Pharmacy</h1>
            <p class="text-on-surface-variant text-xs mt-0.5">Smart care. Better life &bull; Patient Care Portal</p>
        </div>

        <div th:if="${success}" class="bg-emerald-50 text-emerald-800 p-3 rounded-lg mb-4 flex items-center gap-2 text-sm">
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 text-red-800 p-3 rounded-lg mb-4 flex items-center gap-2 text-sm">
            <span class="material-symbols-outlined text-[18px]">error</span>
            <span th:text="${error}"></span>
        </div>

        <div class="bg-surface-container-lowest rounded-xl shadow-sm p-8">
            <div class="flex items-center gap-2 mb-6">
                <span class="material-symbols-outlined text-primary text-[24px]">person</span>
                <h2 class="text-xl font-semibold text-on-surface font-[Plus_Jakarta_Sans]">Customer Login</h2>
            </div>
            <form th:action="@{/login/customer}" method="post" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com" class="w-full h-11 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full h-11 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"/>
                </div>
                <button type="submit" class="w-full h-11 bg-primary text-on-primary rounded-lg font-semibold text-sm hover:opacity-95 transition-opacity flex items-center justify-center gap-2 mt-2">
                    <span class="material-symbols-outlined text-[18px]">login</span>
                    <span>Sign In</span>
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="/register/customer" class="text-primary text-sm font-medium hover:underline">Don't have an account? Register here</a>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="/login/admin" class="text-on-surface-variant text-xs hover:text-on-surface transition-colors">Staff / Pharmacist Portal →</a>
        </div>
    </div>
</body>
</html>
