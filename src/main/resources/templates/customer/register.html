<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Register - Abha Pharmacy</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon-32.png}" href="/images/favicon-32.png"/>
    <link rel="apple-touch-icon" th:href="@{/images/favicon.png}" href="/images/favicon.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:"#005f49","primary-container":"#0d7a5f","on-primary":"#ffffff",surface:"#faf8ff","surface-container-lowest":"#ffffff","surface-container-low":"#f2f3ff","surface-container":"#eaedff","on-surface":"#131b2e","on-surface-variant":"#3e4944",outline:"#6e7a74","outline-variant":"#bdc9c2",error:"#ba1a1a","error-container":"#ffdad6"}}}}</script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4 font-[Inter]">
    <div class="w-full max-w-lg">
        <div class="text-center mb-6">
            <a href="/" class="inline-block hover:scale-105 transition-transform">
                <img th:src="@{/images/logo_mark.png}" src="/images/logo_mark.png" alt="Abha Pharmacy" class="w-16 h-16 mx-auto mb-2 object-contain" />
            </a>
            <h1 class="text-2xl font-bold text-primary font-[Plus_Jakarta_Sans]">Abha Pharmacy</h1>
            <p class="text-on-surface-variant text-xs mt-0.5">Smart care. Better life &bull; New Patient Registration</p>
        </div>

        <div th:if="${success}" class="bg-emerald-50 text-emerald-800 p-3 rounded-lg mb-4 flex items-center gap-2 text-sm">
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 text-red-800 p-3 rounded-lg mb-4 flex items-center gap-2 text-sm">
            <span class="material-symbols-outlined text-[18px]">error</span>
            <span th:text="${error}"></span>
        </div>

        <div class="bg-surface-container-lowest rounded-xl shadow-sm p-8">
            <div class="flex items-center gap-2 mb-6">
                <span class="material-symbols-outlined text-primary text-[24px]">person_add</span>
                <h2 class="text-xl font-semibold text-on-surface font-[Plus_Jakarta_Sans]">Create Account</h2>
            </div>
            <form th:action="@{/register/customer}" method="post" class="flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">First Name *</label>
                        <input type="text" name="firstName" required placeholder="Aarav" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Last Name *</label>
                        <input type="text" name="lastName" required placeholder="Sharma" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Date of Birth *</label>
                        <input type="date" name="dateOfBirth" required class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Gender *</label>
                        <select name="gender" required class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Phone Number</label>
                    <input type="tel" name="phone" placeholder="9876543210" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">House No *</label>
                        <input type="text" name="houseNo" required placeholder="Flat 402, Block B" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Street *</label>
                        <input type="text" name="street" required placeholder="MG Road" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">City *</label>
                        <input type="text" name="city" required placeholder="Bengaluru" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Pincode *</label>
                        <input type="text" name="pincode" required placeholder="560001" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Email *</label>
                    <input type="email" name="email" required placeholder="aarav@example.com" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Password *</label>
                    <input type="password" name="rawPassword" required placeholder="Min. 8 characters" class="w-full h-10 px-3 rounded-lg bg-surface-container-low border border-outline-variant text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/20"/>
                </div>
                <button type="submit" class="w-full h-11 bg-primary text-on-primary rounded-lg font-semibold text-sm hover:opacity-95 transition-opacity flex items-center justify-center gap-2 mt-2">
                    <span class="material-symbols-outlined text-[18px]">how_to_reg</span>
                    <span>Register</span>
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="/login/customer" class="text-primary text-sm font-medium hover:underline">Already have an account? Login</a>
            </div>
        </div>
    </div>
</body>
</html>
